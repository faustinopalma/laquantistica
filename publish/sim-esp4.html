<!DOCTYPE html>
<html lang="en" data-lang="en">

<style>
  /* layout esp3: diagramma a tutta altezza a sinistra, gauge + tabella a destra */
  .panel{grid-template-columns:minmax(0,1fr) 410px;position:relative;}
  .stagecol .sim-stage{flex:1 1 auto;}
  /* tabella della verità */
  .ttab{width:100%;border-collapse:collapse;font-family:var(--n-mono);font-size:.72rem;color:#c7ccd4;background:#0d1a15;}
  .ttab th{color:#8fbfa8;font-weight:600;font-size:.62rem;padding:6px;border-bottom:1px solid #24463a;text-align:center;}
  .ttab td{padding:7px 6px;text-align:center;border-bottom:1px solid #14261f;}
  .ttab tbody tr{cursor:pointer;transition:.12s;}
  .ttab tbody tr:hover{background:#12241d;}
  .ttab tbody tr.active{background:#1c1608;box-shadow:inset 0 0 0 1px #ffb000;}
  .ttab tbody tr.active td{color:#ffd57a;}
  .ttab .res{font-weight:700;font-size:.92rem;color:#cfe0d6;}
  .ttab tr:not(.done) .res{color:#46607a;font-weight:400;font-size:.8rem;}
  .ttab .pcol{background:rgba(224,162,77,.09);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.op{background:#46b083;} .dot.cl{background:#d15a5a;}
  .ass{font-size:.54rem;letter-spacing:.05em;background:#7a1f1f;color:#ffd9d9;padding:1px 5px;border-radius:7px;margin-left:5px;}
  /* header tabella + fumetto */
  .tbl-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--n-mono);font-size:.66rem;color:#8fbfa8;}
  .tblwrap{position:relative;}
  #bubble{left:auto;right:auto;top:auto;bottom:auto;max-width:225px;z-index:7;transform:translateY(8px) scale(.92);}
  #bubble.show{transform:translateY(0) scale(1);}
  #bubble::after{left:-13px;right:auto;top:50%;bottom:auto;transform:translateY(-50%);border:7px solid transparent;border-right-color:#ffb000;border-bottom-color:transparent;}
  /* linea dal gauge (nel disegno) alla colonna della tabella, sovrapposta al pannello */
  .link{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5;}
  #linkpath{fill:none;stroke:#e0a24d;stroke-width:1.9;opacity:0;filter:drop-shadow(0 0 3px rgba(224,162,77,.6));}
  .ctl{font-family:var(--n-mono);font-size:.74rem;color:#c7ccd4;}
  .ctl label{display:block;color:#8fbfa8;margin-bottom:.4rem;}
  .ctl input[type=range]{width:100%;accent-color:#ffb000;cursor:pointer;}
  .ctl .drives-cap{font-size:.62rem;color:#e0a24d;margin-top:.35rem;}
</style>
<script defer src="assets/lang.js?v=5"></script>

<body>
<main class="console" id="top">
  <header class="con-head">
    <div class="con-brand">
      <span class="tag amber">Esperimento 4</span>
      <span class="con-title"><span class="it">Stern-Gerlach in cascata</span><span class="en">Cascaded Stern-Gerlach</span></span>
    </div>
    <div class="con-actions">
      <div class="langsw" role="group" aria-label="Lingua / Language">
        <button class="langbtn" type="button" data-l="it" aria-pressed="false">Italiano</button>
        <button class="langbtn" type="button" data-l="en" aria-pressed="true">English</button>

      <a class="doc-back-top" id="backTop" href="02-stern-gerlach-cascata.html"><span class="it">← Indietro</span><span class="en">← Back</span></a>

  <section class="panel">
    <div class="stagecol">
      <div class="sim-stage"><svg id="svg1" viewBox="0 0 720 510" role="img" aria-label="Esperimento 4: scomposizione e ricombinazione del fascio"></svg></div>
    </div>
    <aside class="ctrlcol">
      <div class="ctl">
        <label><span class="it">Curvatura dei cammini</span><span class="en">Path curvature</span></label>
        <input type="range" id="curve" min="0" max="10" step="0.5" value="0" aria-label="curvatura">
        <div class="drives-cap"><span class="it">↔ trascina: curva il diagramma centrale (illustrativo)</span><span class="en">↔ drag: bends the central diagram (illustrative)</span></div>
      </div>
    </aside>

  <div class="con-foot"><span>La Quantistica · Simulatore · Cap. 02 · Esperimento 4</span><span>F. Palma</span></div>
</main>

<script src="assets/sim-sg-core.js?v=2"></script>
<script>
var svg1 = document.getElementById('svg1');
var blockUp=false, blockDn=false;   // entrambi i rami aperti (nessun muro)
var curveVal=0;                     // curvatura illustrativa del diagramma centrale (0..10)
var bubbleT = null;
var needleCur=0, needleRAF=null;
// muove la lancetta da needleCur al valore target con leggero overshoot (moto realistico)
function tweenNeedle(target, cx, cy){
  var nn=document.getElementById('gaugeNeedle'); if(!nn) return;
  cancelAnimationFrame(needleRAF);
  var start=needleCur;
  nn.setAttribute('transform','rotate('+target+' '+cx+' '+cy+')');   // stato finale: corretto anche senza animazione
  needleCur=target;
  if(Math.abs(target-start)<0.5) return;
  var t0=null, dur=850, c=1.5;
  function ease(p){ p-=1; return 1 + p*p*((c+1)*p + c); }            // back-out (rimbalzo da lancetta)
  function step(ts){
    if(t0===null) t0=ts;
    var p=(ts-t0)/dur;
    if(p>=1){ nn.setAttribute('transform','rotate('+target+' '+cx+' '+cy+')'); return; }
    var a=start+(target-start)*ease(p);
    nn.setAttribute('transform','rotate('+a.toFixed(2)+' '+cx+' '+cy+')');
    needleRAF=requestAnimationFrame(step);
  }
  needleRAF=requestAnimationFrame(step);
}
function fw(f){ return 0.6 + f * 8; }
// piccolo sensore quadrato posto sul fascio, a valle della macchina 5
function sensorSquare(cx, cy, col){
  var s=7;
  el('rect',{x:cx-s,y:cy-s,width:2*s,height:2*s,rx:1.5,fill:'#0d1a15',stroke:col,'stroke-width':1.7},svg1);
  el('circle',{cx:cx,cy:cy,r:2.3,fill:col},svg1);
}
// scatola-polo per la vista schematica «come si separa e ricombina»
function poleBox(x,yTop,yBot){
  el('rect',{x:x-34,y:yTop,width:68,height:yBot-yTop,rx:2,fill:PANEL,stroke:INK,'stroke-width':1.4},svg1);
}
// freccia verticale (gradiente di campo): punta in su se y1<y0
function vArrow(x,y0,y1,col){
  el('line',{x1:x,y1:y0,x2:x,y2:y1,stroke:col,'stroke-width':1.6},svg1);
  var d=(y1<y0?-1:1);
  el('path',{d:'M'+(x-3.2)+' '+(y1-d*5.5)+' L'+x+' '+y1+' L'+(x+3.2)+' '+(y1-d*5.5),fill:'none',stroke:col,'stroke-width':1.6,'stroke-linecap':'round','stroke-linejoin':'round'},svg1);
}

/* ---- risultati per caso ---- */
function results(bu,bd){
  if(bu && bd) return { Pp:0, Pm:0, recFlux:0, none:true };   // entrambi bloccati: nessun fascio
  if(!bu && !bd) return { Pp:1, Pm:0, recFlux:0.5 };          // entrambi aperti: ricombina 100/0
  return { Pp:0.5, Pm:0.5, recFlux:0.25 };                    // un solo ramo: 50/50
}

function drawExp3(){
  [].slice.call(svg1.childNodes).forEach(function(nd){ if(nd.id!=='gaugeNeedleG') svg1.removeChild(nd); });
  var r = results(blockUp, blockDn);
  var showUp = !blockUp;   // il ramo m₉₀=+k (superiore) passa se non bloccato
  var showDn = !blockDn;   // il ramo m₉₀=−k (inferiore) passa se non bloccato
  var fUp = r.recFlux*r.Pp, fDn = r.recFlux*r.Pm;

  // ===== BANDA 1: viste di taglio delle 5 macchine =====
  txt(360,16,'— vista trasversale · le 5 macchine SG  (1 e 5 a ϑ=0°, 2·3·4 a ϑ=90°) —',{'text-anchor':'middle','font-family':'monospace','font-size':10,fill:'#5a7d6a'},svg1);
  sgMagnet( 95,98,0, '1', svg1);
  sgMagnet(215,98,90,'2', svg1);
  sgMagnet(340,98,90,'3', svg1);
  sgMagnet(465,98,90,'4', svg1);
  sgMagnet(560,98,0, '5', svg1);
  el('line',{x1:40,y1:156,x2:680,y2:156,stroke:'#1c3a30','stroke-width':1},svg1);

  // ===== BANDA 2: come le macchine 2·3·4 separano e poi ricombinano (allineata a 2·3·4) =====
  txt(360,172,'— come le macchine 2·3·4 separano e poi ricombinano il fascio —',{'text-anchor':'middle','font-family':'monospace','font-size':10,fill:'#5a7d6a'},svg1);
  var mc=258, uT=214,uB=236, lT=280,lB=302;
  var bowA = curveVal*1.2;                                   // ampiezza della curvatura (illustrativa) ∝ slider
  function bY(x){ return bowA * (1 - Math.pow((x-345)/195, 2)); }   // 0 ai bordi, max al centro
  [215,340,465].forEach(function(mx){ var o=bY(mx); poleBox(mx,uT+o,uB+o); poleBox(mx,lT+o,lB+o); });
  beam(150,mc+bY(150),195,mc+bY(195), 2.2,1, INK, svg1);
  curveBeam(195,mc+bY(195),300,244+bY(300), 2,1, ACC, svg1); beam(300,244+bY(300),380,244+bY(380), 2,1, ACC, svg1); curveBeam(380,244+bY(380),485,mc+bY(485), 2,1, ACC, svg1);
  curveBeam(195,mc+bY(195),300,272+bY(300), 2,1, BLU, svg1); beam(300,272+bY(300),380,272+bY(380), 2,1, BLU, svg1); curveBeam(380,272+bY(380),485,mc+bY(485), 2,1, BLU, svg1);
  beam(485,mc+bY(485),540,mc+bY(540), 2.2,1, INK, svg1);
  vArrow(215, 274+bY(215), 242+bY(215), '#e0a24d');   // macchina 2
  vArrow(340, 242+bY(340), 274+bY(340), '#e0a24d');   // macchina 3
  vArrow(465, 274+bY(465), 242+bY(465), '#e0a24d');   // macchina 4
  txt(150,mc-8+bY(150),'|m₀=+k⟩',{'font-size':8.5,fill:INK,'font-family':'monospace'},svg1);
  txt(275,230+bY(275),'m₉₀=+k',{'text-anchor':'middle','font-size':8,fill:ACC,'font-family':'monospace'},svg1);
  txt(275,290+bY(275),'m₉₀=−k',{'text-anchor':'middle','font-size':8,fill:BLU,'font-family':'monospace'},svg1);
  el('line',{x1:40,y1:316,x2:680,y2:316,stroke:'#1c3a30','stroke-width':1},svg1);

  // ===== BANDA 3: diagramma a flussi interattivo (porte, sensore, misura) =====
  var yIn=478, yPlat=438, up=yPlat-34, dn=yPlat+34;
  txt(360,334,'— diagramma a flussi (larghezza ∝ flusso) · misura di m₀ —',{'text-anchor':'middle','font-family':'monospace','font-size':10,fill:'#5a7d6a'},svg1);
  txt(16,yIn-4,'⟶',{'font-size':18,fill:INK},svg1);
  txt(12,yIn+18,'Ag',{'font-size':9,fill:'#6f8f80','font-family':'monospace'},svg1);
  beam(40,yIn,95,yIn, fw(1),1, INK, svg1);
  curveBeam(95,yIn,158,yPlat, fw(0.5),1, ACC, svg1);
  beam(158,yPlat,215,yPlat, fw(0.5),1, ACC, svg1);
  txt(140,yPlat-8,'|m₀=+k⟩',{'font-size':9,fill:ACC,'font-family':'monospace','text-anchor':'middle'},svg1);
  curveBeam(215,yPlat,285,up, fw(0.25), showUp?1:.35, showUp?ACC:DIM, svg1);
  curveBeam(215,yPlat,285,dn, fw(0.25), showDn?1:.35, showDn?BLU:DIM, svg1);
  txt(262,up-8,'m₉₀=+k',{'font-size':8.5,fill:ACC,'font-family':'monospace'},svg1);
  txt(262,dn+16,'m₉₀=−k',{'font-size':8.5,fill:BLU,'font-family':'monospace'},svg1);
  var gx=340;
  beam(285,up, showUp?405:gx, up, fw(0.25), showUp?1:.35, showUp?ACC:DIM, svg1);
  beam(285,dn, showDn?405:gx, dn, fw(0.25), showDn?1:.35, showDn?BLU:DIM, svg1);
  if(showUp) curveBeam(405,up,465,yPlat, fw(0.25),1, ACC, svg1);
  if(showDn) curveBeam(405,dn,465,yPlat, fw(0.25),1, BLU, svg1);
  // fascio ricombinato -> macchina 5 (SG ϑ=0°, x=560): SPLIT in +k (su, non misurato) e −k (giù -> gauge)
  txt(560,yPlat-18,'macchina 5',{'text-anchor':'middle','font-size':8.5,fill:'#8fbfa8','font-family':'monospace'},svg1);
  if(!r.none){
    beam(465,yPlat,560,yPlat, fw(r.recFlux),1, INK, svg1);
    curveBeam(560,yPlat,614,yPlat-32, fw(fUp), fUp>0?1:.45, fUp>0?ACC:DIM, svg1);
    beam(614,yPlat-32,652,yPlat-32, fw(fUp), fUp>0?1:.45, fUp>0?ACC:DIM, svg1);
    curveBeam(560,yPlat,614,yPlat+30, fw(fDn), fDn>0?1:.55, fDn>0?BLU:DIM, svg1);
    beam(614,yPlat+30,638,yPlat+30, fw(fDn), fDn>0?1:.55, fDn>0?BLU:DIM, svg1);
  }
  txt(610,yPlat-38,'+k',{'text-anchor':'middle','font-size':9,fill:DIM,'font-family':'monospace'},svg1);
  txt(610,yPlat+42,'−k',{'text-anchor':'middle','font-size':9,fill:BLU,'font-family':'monospace'},svg1);
  drawGauge(668, yPlat+30, 30, r.Pm, !r.none);
}

// GAUGE a lancetta disegnato nel diagramma (macchina 5); lancetta persistente animata con transizione CSS
function drawGauge(cx,cy,R,val,live){
  var col = live? '#ffb000' : DIM;
  el('path',{d:'M'+(cx-R)+' '+cy+' A '+R+' '+R+' 0 0 1 '+(cx+R)+' '+cy,fill:'none',stroke:'#2a4a3c','stroke-width':5,'stroke-linecap':'round'},svg1);
  el('line',{x1:cx-R,y1:cy,x2:cx-R+7,y2:cy,stroke:'#4a6b59','stroke-width':1.4},svg1);
  el('line',{x1:cx,y1:cy-R,x2:cx,y2:cy-R+7,stroke:'#4a6b59','stroke-width':1.4},svg1);
  el('line',{x1:cx+R,y1:cy,x2:cx+R-7,y2:cy,stroke:'#4a6b59','stroke-width':1.4},svg1);
  txt(cx-R,cy+11,'0',{'font-size':7,fill:'#6f8f80','font-family':'monospace','text-anchor':'middle'},svg1);
  txt(cx+R,cy+11,'100',{'font-size':7,fill:'#6f8f80','font-family':'monospace','text-anchor':'middle'},svg1);
  txt(cx,cy+15,fmtPct(val),{'font-size':12,fill: live?'#ffd57a':DIM,'font-family':'monospace','font-weight':'bold','text-anchor':'middle'},svg1);
  txt(cx,cy+26,'P(m₀=−k)',{'font-size':7.5,fill:'#8fbfa8','font-family':'monospace','text-anchor':'middle'},svg1);
  el('circle',{id:'gaugeAnchor',cx:cx+R,cy:cy,r:0.6,fill:'none'},svg1);
  // lancetta PERSISTENTE: ruota con transizione CSS -> si muove a ogni misura
  var g=document.getElementById('gaugeNeedleG');
  if(!g){
    g=el('g',{id:'gaugeNeedleG'},svg1);
    el('line',{id:'gaugeNeedle',x1:cx,y1:cy,x2:cx,y2:cy-R+5,'stroke-width':2.5,'stroke-linecap':'round',transform:'rotate(0 '+cx+' '+cy+')'},g);
    el('circle',{id:'gaugeHub',cx:cx,cy:cy,r:3.8},g);
  }
  var rot=(val-0.5)*180;
  document.getElementById('gaugeNeedle').setAttribute('stroke',col);
  document.getElementById('gaugeHub').setAttribute('fill',col);
  tweenNeedle(rot, cx, cy);
}

initBackLink('02-stern-gerlach-cascata.html');
drawExp3();
document.getElementById('curve').addEventListener('input', function(){ curveVal=+this.value; drawExp3(); });
</script>
